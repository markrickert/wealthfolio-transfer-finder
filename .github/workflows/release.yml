name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  WEALTHFOLIO_REF: main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wealthfolio_transfers

      - uses: actions/checkout@v4
        with:
          repository: wealthfolio/wealthfolio
          ref: ${{ env.WEALTHFOLIO_REF }}
          path: wealthfolio

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: wealthfolio_transfers/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Wealthfolio SDK packages
        working-directory: wealthfolio
        run: |
          pnpm install --frozen-lockfile --filter "@wealthfolio/addon-sdk..." --filter "@wealthfolio/ui..."
          pnpm --filter @wealthfolio/addon-sdk --filter @wealthfolio/ui build

      - name: Check tag matches package and manifest versions
        working-directory: wealthfolio_transfers
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json manifest.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$tag" ]; then
              echo "::error::$f version $v does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Test and bundle
        working-directory: wealthfolio_transfers
        run: |
          pnpm install --frozen-lockfile
          pnpm type-check
          pnpm test
          pnpm bundle

      - name: Publish GitHub release
        working-directory: wealthfolio_transfers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Transfer Finder $GITHUB_REF_NAME" \
            --notes-file release-notes.md
